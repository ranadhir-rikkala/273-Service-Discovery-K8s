apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  labels:
    app: client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
        - name: client
          image: inventory-client:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: INVENTORY_URL
              value: http://inventory:8080/inventory
            - name: INTERVAL
              value: "1"
